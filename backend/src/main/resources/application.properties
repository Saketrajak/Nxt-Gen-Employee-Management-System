# =============================================================================
# APPLICATION CONFIGURATION - IAIP EMPLOYEE MANAGEMENT SYSTEM
# =============================================================================
server.port=${PORT:8080}

# Database Connection (Supports Local PostgreSQL & Cloud Supabase / Neon via Environment Variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/iaip_ems}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# JWT Security Configuration (HS256 256-bit secure key)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration-ms=86400000

# CORS Allowed Origins
cors.allowed-origins=http://localhost:5173,http://localhost:3000,https://*.vercel.app

# Swagger / OpenAPI Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
